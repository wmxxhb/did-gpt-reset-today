<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>GPT今天重置了吗？</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="window">
    <aside class="sidebar">
      <div class="brand"><div class="brand-icon"><svg class="icon"><use href="/icons.svg#activity"/></svg></div><strong>GPT今天重置了吗？</strong></div>
      <nav aria-label="主导航">
        <button class="nav active" data-page="home"><svg class="icon"><use href="/icons.svg#monitor"/></svg>概览</button>
        <button class="nav" data-page="activity"><svg class="icon"><use href="/icons.svg#activity"/></svg>最近动态</button>
        <button class="nav" data-page="notifications"><svg class="icon"><use href="/icons.svg#bell"/></svg>通知设置</button>
        <button class="nav" data-page="more"><svg class="icon"><use href="/icons.svg#sliders-horizontal"/></svg>更多</button>
      </nav>
      <div class="sidebar-bottom"><div id="cloud-state"><span class="dot muted"></span>正在读取状态</div><small id="version">本机管理</small></div>
    </aside>
    <div class="workspace">
      <header class="toolbar"><h1 id="page-name">概览</h1><div class="toolbar-right"><span id="today"></span><button id="refresh" class="button" aria-label="刷新状态"><svg class="icon"><use href="/icons.svg#refresh-cw"/></svg><span>刷新</span></button></div></header>
      <main id="main" tabindex="-1"><div class="loading"><span class="spinner"></span><p>正在读取最新动态…</p></div></main>
      <footer><span id="last-updated">正在连接</span><div class="footer-links"><a class="source-link" href="https://codex-reset.com/" target="_blank" rel="noopener noreferrer">codex-reset.com <svg class="icon"><use href="/icons.svg#arrow-up-right"/></svg></a><a href="https://github.com/wmxxhb/did-gpt-reset-today" target="_blank" rel="noopener noreferrer" title="查看项目源码与使用指南">GitHub <svg class="icon"><use href="/icons.svg#arrow-up-right"/></svg></a></div></footer>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="flow" aria-labelledby="flow-title">
    <div class="dialog-top"><div class="dialog-icon"><svg class="icon"><use href="/icons.svg#settings"/></svg></div><button id="flow-close" class="icon-button" aria-label="关闭操作窗口"><svg class="icon"><use href="/icons.svg#x"/></svg></button></div>
    <h2 id="flow-title">正在准备</h2>
    <div id="flow-progress" role="status" aria-live="polite"></div>
    <div id="flow-guidance"></div><div id="qr-area"></div><div id="prompt-area"></div><div id="flow-result" aria-live="polite"></div>
    <details class="operation-details"><summary>操作详情</summary><div id="flow-logs"></div></details>
  </dialog>
</body>
</html>
